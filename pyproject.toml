[project]
name = "kakeyalogic"
version = "1.0.0"
description = "KakeyaLogic typed-directional field and SAVER grain routing reference"
requires-python = ">=3.9"
readme = "README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
