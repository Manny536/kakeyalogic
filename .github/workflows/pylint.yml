name: Pylint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pylint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pylint (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and lint dependencies
        run: python -m pip install -e . numpy scipy "pylint==4.1.3"
      - name: Check Python errors
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z '*.py')
          python -m pylint --errors-only --py-version=3.12 "${files[@]}"
