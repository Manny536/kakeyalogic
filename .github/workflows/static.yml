name: Deploy static content to Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontier-math-rework/**"
      - "src/kakeyalogic/**"
      - "tools/build_frontier*.py"
      - "index.html"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Pages app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify browser engine source parity
        run: python tools/build_frontier_web.py --check
      - name: Check application JavaScript
        run: |
          node --check frontier-math-rework/worker.js
          node --check frontier-math-rework/app.js
      - name: Prepare static site and pinned same-origin runtime
        run: python tools/build_frontier_pages.py --output _site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
