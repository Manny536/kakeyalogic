name: verify

on:
  push:
  pull_request:

jobs:
  saver:
    name: SAVER reference tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract and behavioral tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Calibration runner
        run: PYTHONPATH=src python examples/typed_directional_state/run_saver_reference.py
